# PropPal Backend Services - Local Development
# Connects to external MongoDB Atlas

services:
  # FastAPI Gateway Service
  gateway:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: proppal-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../apps/backend/.env
    environment:
      # Service configuration
      - SERVICE_NAME=gateway
    volumes:
      - ../../apps/backend:/app
      - /app/venv
    networks:
      - proppal-network
    command: uvicorn services.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # NLP/RAG Service (Placeholder)
  nlp-service:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: proppal-nlp-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../../apps/backend/.env
    environment:
      # Service configuration
      - SERVICE_NAME=nlp-service
    volumes:
      - ../../apps/backend:/app
      - /app/venv
    networks:
      - proppal-network
    command: echo "NLP Service placeholder - implement NLP service entrypoint"
    profiles:
      - nlp  # Optional service, enable with: docker compose --profile nlp up

networks:
  proppal-network:
    driver: bridge

